name: update awesome-stars & product remix

on:
  workflow_dispatch:
  schedule:
  - cron: 30 0 * * *

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "awesome-stars"
  cancel-in-progress: false

jobs:
  awesome-stars:
    name: Update Stars, Classify & Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install starred

    - name: Extract repository details
      run: |
        echo "OWNER=${GITHUB_REPOSITORY_OWNER}" >> $GITHUB_ENV

    - name: Fetch raw stars by language
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        USERNAME: ${{ env.OWNER }}
      run: |
        starred --username "${USERNAME}" --sort --token "${GITHUB_TOKEN}" > languages.md.tmp || true
        if grep -q '^# Awesome Stars' languages.md.tmp && grep -q '^- \[' languages.md.tmp; then
          mv languages.md.tmp languages.md
          echo "✅ Updated languages.md via starred"
        else
          echo "::warning::starred failed for languages.md ($(head -n 1 languages.md.tmp)); falling back to REST API fetcher"
          rm -f languages.md.tmp
          python scripts/fetch_stars.py --username "${USERNAME}" --languages languages.md
        fi

    - name: Fetch raw stars by topic
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        USERNAME: ${{ env.OWNER }}
      run: |
        starred --username "${USERNAME}" --sort --token "${GITHUB_TOKEN}" --topic --topic_limit 500 > topics.md.tmp || true
        if grep -q '^# Awesome Stars' topics.md.tmp && grep -q '^- \[' topics.md.tmp; then
          mv topics.md.tmp topics.md
          echo "✅ Updated topics.md via starred"
        else
          echo "::warning::starred failed for topics.md ($(head -n 1 topics.md.tmp)); falling back to REST API fetcher"
          rm -f topics.md.tmp
          python scripts/fetch_stars.py --username "${USERNAME}" --topics topics.md
        fi

    - name: Run AI Classification & Product Catalog Generator
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python scripts/update_and_classify.py

    - name: Commit and push catalog updates
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add README.md IDEAS.md index.html data/repos.json data/ideas.json languages.md topics.md scripts/
        if ! git diff-index --quiet HEAD; then
          git commit -m "chore(catalog): update AI-classified product remix catalog & web UI"
          git push origin HEAD:master
        else
          echo "No changes to commit."
        fi

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact for GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: .

  deploy:
    name: Deploy to GitHub Pages
    needs: awesome-stars
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
