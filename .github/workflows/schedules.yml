name: update awesome-stars & product remix

on:
  workflow_dispatch:
  schedule:
  - cron: 30 0 * * *

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "awesome-stars"
  cancel-in-progress: false

jobs:
  awesome-stars:
    name: Update Stars, Classify & Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install starred

    - name: Extract repository details
      run: |
        echo "REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
        echo "OWNER=${GITHUB_REPOSITORY_OWNER}" >> $GITHUB_ENV

    - name: Fetch raw stars by language
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ env.REPOSITORY_NAME }}
        USERNAME: ${{ env.OWNER }}
      run: |
        starred --username ${USERNAME} --repository ${REPOSITORY} --sort --token ${GITHUB_TOKEN} --filename languages.md --message 'chore(data): update raw stars by language'

    - name: Fetch raw stars by topic
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ env.REPOSITORY_NAME }}
        USERNAME: ${{ env.OWNER }}
      run: |
        starred --username ${USERNAME} --repository ${REPOSITORY} --sort --token ${GITHUB_TOKEN} --message 'chore(data): update raw stars by topic' --topic --topic_limit 500 --filename topics.md

    - name: Pull latest remote changes from starred commits
      run: |
        git pull --rebase origin master || true

    - name: Run AI Classification & Product Catalog Generator
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python scripts/update_and_classify.py

    - name: Commit and push catalog updates
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add README.md index.html data/repos.json languages.md topics.md scripts/
        if ! git diff-index --quiet HEAD; then
          git commit -m "chore(catalog): update AI-classified product remix catalog & web UI"
          git push origin HEAD:master
        else
          echo "No changes to commit."
        fi

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v4
      continue-on-error: true

    - name: Upload artifact for GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: .
      continue-on-error: true

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      continue-on-error: true
